<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <rect x="0" y="0" width="240" height="200" rx="16" fill="#0f172a"/>
  <rect x="10" y="10" width="220" height="180" rx="12" fill="#1e293b"/>

  <text x="120" y="28" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" letter-spacing="3">FRONT</text>
  <path d="M100 33 h40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <g stroke="#94a3b8" stroke-width="4" fill="none" stroke-linejoin="round">
    <rect x="46" y="44" width="26" height="36" rx="8"/>
    <rect x="168" y="44" width="26" height="36" rx="8"/>
    <rect x="46" y="138" width="26" height="36" rx="8"/>
    <rect x="168" y="138" width="26" height="36" rx="8"/>
  </g>

  <g stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- front tires straight back, same side -->
    <path d="M30 50 V154"/>
    <path d="M24 146 l6 8 l6 -8"/>
    <path d="M210 50 V154"/>
    <path d="M204 146 l6 8 l6 -8"/>
    <!-- rear left crosses to front right -->
    <path d="M52 134 V122 H188 V84"/>
    <path d="M182 92 l6 -8 l6 8"/>
    <!-- rear right crosses to front left -->
    <path d="M174 134 V104 H66 V84"/>
    <path d="M60 92 l6 -8 l6 8"/>
  </g>

  <text x="120" y="190" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-size="11" letter-spacing="1">FORWARD CROSS</text>
</svg>
